<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DawnV Music</title>
<style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #player { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="player"></div>
<script>
// Zwischenseite fuer den DawnV-Loadingscreen (dawnv_loadingscreenv2).
// YouTube spielt eingebettete Videos nur auf echten Webseiten ab (sonst Fehler 153),
// der Loadingscreen laeuft aber unter nui://. Er bindet deshalb diese Seite ein und
// steuert den Player per postMessage. Live-Kopie: https://reinert-digital.github.io/dawnv-music/
var player = null;
var ready = false;

function send(msg) {
    msg.dawnv = true;
    if (window.parent !== window) window.parent.postMessage(msg, "*");
}

function onYouTubeIframeAPIReady() {
    player = new YT.Player("player", {
        width: "100%",
        height: "100%",
        playerVars: { controls: 0, disablekb: 1, playsinline: 1, rel: 0 },
        events: {
            onReady: function () { ready = true; send({ type: "ready" }); },
            onStateChange: function (e) {
                if (e.data === YT.PlayerState.ENDED) send({ type: "ended" });
                else if (e.data === YT.PlayerState.PLAYING) send({ type: "playing" });
            },
            onError: function (e) { send({ type: "error", code: e.data }); }
        }
    });
}

window.addEventListener("message", function (e) {
    var d = e.data;
    if (!ready || !d || d.dawnv !== true) return;
    switch (d.type) {
        case "load":
            if (/^[A-Za-z0-9_-]{11}$/.test(d.id)) player.loadVideoById(d.id);
            break;
        case "play": player.playVideo(); break;
        case "pause": player.pauseVideo(); break;
        case "stop": player.stopVideo(); break;
        case "volume": player.setVolume(Math.max(0, Math.min(100, Number(d.value) || 0))); break;
        case "mute": if (d.value) player.mute(); else player.unMute(); break;
    }
});
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
